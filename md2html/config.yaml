# ============================================================
#  md2html — 默认配置文件
#  修改此文件即可改变样式、输出路径、代码高亮等行为。
#  任何被省略的键会自动回退到内置默认值。
# ============================================================

site:
  # 博客标题（显示在页面顶部毛玻璃导航栏）
  title: "DuckLing's Blog"
  # 头像路径（相对于站点根目录）
  avatar: "/img/avatar.jpg"
  # 站点首页 URL
  home_url: "/"

output:
  # 生成的 HTML 文件默认存放目录（未通过 -o 指定输出路径时生效）
  default_dir: "./output"

# 文章列表配置文件（相对于项目根目录）
articles_js: "../articles.js"

styles:
  # --- 一级标题 (h1) ---
  title:
    font: "Poppins"        # 字体名称（Google Fonts 自动加载）
    size: "2em"            # 字号
    weight: "700"          # 粗细: 400=Regular, 600=SemiBold, 700=Bold

  # --- 其余标题 (h2 ~ h6) 共用此字体 ---
  heading:
    font: "Poppins"

  # --- 正文 ---
  body:
    font: "Lora"           # 正文字体（中文自动回退到 Noto Serif SC）
    size: "16px"           # 基础字号
    line_height: "1.8"     # 行高倍率

  # --- 颜色方案 ---
  background_color: "#000000"   # 页面背景色
  text_color:       "#e0e0e0"   # 正文文字颜色
  link_color:       "#6ea8fe"   # 超链接颜色

  # --- 布局 ---
  max_width: "800px"           # 正文内容最大宽度

# ----------------------------------------------------------
#  代码块设置
# ----------------------------------------------------------
code:
  # Pygments 语法高亮主题（可选值: monokai, nord, material, github-dark, one-dark 等）
  theme: "monokai"
  show_line_numbers: false     # 是否显示行号
  border_radius: 8             # 代码容器圆角，单位 px
  background: "#1e1e1e"        # 代码区域背景色

# ----------------------------------------------------------
#  页面元信息
# ----------------------------------------------------------
# ----------------------------------------------------------
#  页面脚注（版权信息）
# ----------------------------------------------------------
footer:
  text: "© 2025 - 2026 By DuckLing"   # 版权文字（link_text 出现的位置会被替换为超链接）
  link_url: "https://duckee.top"       # 超链接目标 URL
  link_text: "DuckLing"                # 需要转为超链接的文字（留空则不生成链接）

# ----------------------------------------------------------
#  页面元信息
# ----------------------------------------------------------
meta:
  lang: "zh-CN"                # 页面语言（影响星期显示、字体回退等）
  viewport: "width=device-width, initial-scale=1.0"
