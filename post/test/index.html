/* === Reset & Base === */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background-color: #000000;
    color: #e0e0e0;
    font-family: 'Lora', Georgia, 'Noto Serif SC', serif;
    font-size: 16px;
    line-height: 1.8;
    padding: 100px 1rem 2rem;
    -webkit-font-smoothing: antialiased;
}

/* === Site header (frosted glass) === */
.site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    background: rgba(10,10,10,.65);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(255,255,255,.06);
}

.site-header .header-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
}

.site-header .header-title {
    font-family: 'Poppins', 'Noto Sans SC', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: #eee;
    letter-spacing: -.3px;
    text-decoration: none;
}

.site-header .header-title:hover { opacity: .7; }

.blog-post {
    max-width: 800px;
    margin: 0 auto;
}

/* === Headings === */
.blog-post h1, .blog-post h2, .blog-post h3,
.blog-post h4, .blog-post h5, .blog-post h6 {
    font-family: 'Poppins', 'Noto Sans SC', sans-serif;
    font-weight: 700;
    line-height: 1.3;
    margin-top: 2em;
    margin-bottom: 0.5em;
}

.blog-post h1 { font-size: 2em; }
.blog-post h2 { font-size: 1.5em; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.3em; }
.blog-post h3 { font-size: 1.25em; }

/* === Post date (below title) === */
.blog-post .post-date {
    display: block;
    font-family: 'Poppins', 'Noto Sans SC', sans-serif;
    font-size: 0.875em;
    color: rgba(255,255,255,0.4);
    margin-top: 0.2em;
    margin-bottom: 2.5em;
}

/* === Paragraph === */
.blog-post p { margin-bottom: 1.2em; }

/* === Links === */
.blog-post a {
    color: #6ea8fe;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color .2s;
}
.blog-post a:hover { border-bottom-color: #6ea8fe; }

/* === Images === */
.blog-post img {
    max-width: 100%;
    height: auto;
    border-radius: 6px;
    margin: 1.5em 0;
    display: block;
}

/* === Inline code === */
.blog-post code:not(pre code) {
    background: rgba(255,255,255,0.08);
    padding: 0.2em 0.4em;
    border-radius: 4px;
    font-size: 0.9em;
    font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
    color: #f0c060;
}

/* === Code block container === */
.blog-post .code-block {
    background: #1e1e1e;
    border-radius: 8px;
    margin: 1.5em 0;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

/* Code block header — language label (pymdownx auto_title) */
.blog-post .code-block > .filename {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5em 1em;
    background: #2d2d2d;
    color: #858585;
    font-size: 0.75em;
    font-family: 'Poppins', 'Noto Sans SC', sans-serif;
    text-transform: uppercase;
    letter-spacing: .05em;
    user-select: none;
}

/* Code content area */
.blog-post .code-block > pre {
    padding: 1em;
    margin: 0;
    overflow-x: auto;
    font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
    font-size: 0.875em;
    line-height: 1.6;
    background: transparent;
}

.blog-post .code-block > pre code {
    background: transparent;
    padding: 0;
    font-size: inherit;
    color: inherit;
}

/* Line numbers table layout */
.blog-post .code-block .linenodiv {
    padding-right: 1em;
    border-right: 1px solid rgba(255,255,255,0.08);
    margin-right: 1em;
}

.blog-post .code-block .linenodiv pre {
    color: rgba(255,255,255,0.25);
    user-select: none;
}

/* === Tables === */
.blog-post table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.5em 0;
}

.blog-post th, .blog-post td {
    border: 1px solid rgba(255,255,255,0.12);
    padding: 0.6em 0.8em;
    text-align: left;
}

.blog-post th {
    background: rgba(255,255,255,0.04);
    font-weight: 600;
    font-family: 'Poppins', 'Noto Sans SC', sans-serif;
}

/* === Blockquote === */
.blog-post blockquote {
    border-left: 3px solid rgba(255,255,255,0.25);
    margin: 1.5em 0;
    padding: 0.5em 1em;
    color: rgba(255,255,255,0.65);
    font-style: italic;
}

.blog-post blockquote p:last-child { margin-bottom: 0; }

/* === Lists === */
.blog-post ul, .blog-post ol {
    margin: 0.8em 0;
    padding-left: 1.5em;
}

.blog-post li { margin-bottom: 0.3em; }
.blog-post li:last-child { margin-bottom: 0; }

/* === Horizontal rule === */
.blog-post hr {
    border: none;
    border-top: 1px solid rgba(255,255,255,0.08);
    margin: 2.5em 0;
}

/* === Task list === */
.blog-post .task-list-item {
    list-style: none;
    margin-left: -1.5em;
}

.blog-post .task-list-item input {
    margin-right: 0.4em;
}

/* === Footer === */
.blog-post .post-footer-sep {
    border: none;
    border-top: 1px solid rgba(255,255,255,0.1);
    margin: 3em 0 1.5em;
}

.blog-post .post-footer {
    text-align: center;
    font-family: 'Poppins', 'Noto Sans SC', sans-serif;
    font-size: 0.8em;
    color: rgba(255,255,255,0.3);
}

.blog-post .post-footer a {
    color: rgba(255,255,255,0.4);
    border-bottom: none;
    transition: color .2s;
}

.blog-post .post-footer a:hover {
    color: #6ea8fe;
}

/* === Back link === */
.blog-post .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 3em;
    font-family: 'Poppins', 'Noto Sans SC', sans-serif;
    font-size: 0.875em;
    color: rgba(255,255,255,0.4);
    text-decoration: none;
    border-bottom: none;
    transition: color .2s;
}

.blog-post .back-link:hover {
    color: #bbb;
}
